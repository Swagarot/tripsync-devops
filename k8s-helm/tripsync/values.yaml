backend:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  image:
    repository: swagarot/tripsync-backend
    tag: latest
  port: 5000
  replicaCount: 1

frontend:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }
  image:
    repository: swagarot/tripsync-frontend
    tag: latest
  port: 80
  replicaCount: 1

postgres:
  # Pinned to an exact minor version: a new major (19) needs a dump/restore or
  # pg_upgrade, never just a tag bump.
  image: postgres:18.6-alpine
  # k3s: Longhorn (replicated across both workers). The EKS deploys override
  # this with gp3 (see the Jenkinsfiles and terraform/aws/cluster.tf).
  storageClassName: longhorn
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

garage:
  # Object storage for users' photos (S3 API). Off = photo uploads disabled.
  enabled: true
  image: dxflrs/garage:v2.4.1
  # Empty = same StorageClass as Postgres (longhorn on k3s, gp3 on EKS).
  storageClassName: ""
  storage: 10Gi
  # How much of the volume Garage may fill (a bit below the volume size).
  capacityGb: 8
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 512Mi }

s3:
  # Photos in AWS S3 instead of Garage (EKS: turn garage off and this on). The
  # bucket and the IAM role come from terraform/aws; the backend pod gets the
  # role through EKS Pod Identity, linked to the ServiceAccount below, so no
  # access key is stored anywhere.
  enabled: false
  bucket: ""
  region: ""
  serviceAccount: tripsync-backend

externalSecrets:
  # Make the hand-made Secrets from HashiCorp Vault through the External
  # Secrets Operator (terraform/vault, vault/README.md). Off = create them by
  # hand with kubectl as before; everything else works the same.
  enabled: false
  store: vault              # the ClusterSecretStore's name
  openrouteservice: true    # Secret openrouteservice (routes; optional for the app)
  cloudflared: true         # Secret cloudflared-token (homelab tunnel only)

backup:
  # Nightly pg_dump + photo mirror to the NFS server. Off by default: only the
  # homelab has the nfs-client StorageClass, so values-k3s.yaml turns it on.
  # (It used to be switched on by asking the cluster with `lookup`; Argo CD
  # renders the chart without the cluster, so that check always said no.)
  enabled: false
  storageClassName: nfs-client
  storage: 30Gi
  schedule: "30 3 * * *"        # 03:30 every night
  timeZone: Asia/Jerusalem
  keepDays: 14                  # database dumps older than this are deleted
  rcloneImage: rclone/rclone:1.75.1

namespace: tripsync
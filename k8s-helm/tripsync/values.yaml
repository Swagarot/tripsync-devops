backend:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 256Mi }
  image:
    repository: swagarot/tripsync-backend
    tag: latest
  port: 5000
  replicaCount: 1

frontend:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 128Mi }
  image:
    repository: swagarot/tripsync-frontend
    tag: latest
  port: 80
  replicaCount: 1

postgres:
  # Pinned to an exact minor version: a new major (19) needs a dump/restore or
  # pg_upgrade, never just a tag bump.
  image: postgres:18.6-alpine
  # k3s: Longhorn (replicated across both workers). The EKS deploys override
  # this with gp3 (see the Jenkinsfiles and terraform/aws/cluster.tf).
  storageClassName: longhorn
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

namespace: tripsync
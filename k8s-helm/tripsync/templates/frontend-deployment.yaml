apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripsync-frontend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  # Old ReplicaSets kept (default 10); see backend-deployment.yaml.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: tripsync-frontend
  template:
    metadata:
      labels:
        app: tripsync-frontend
    spec:
      securityContext:
        # The image runs as nginx's uid 101 (nginx-unprivileged, see the
        # frontend Dockerfile). Kubernetes refuses to start it if an image
        # ever tries to run as root, like the backend.
        runAsNonRoot: true
        # Ports below 1024 normally need root. This lets the non-root nginx
        # (nginx-unprivileged image, uid 101) keep listening on 80, inside
        # this pod's own network namespace only (a "safe" sysctl; Docker sets
        # the same by default, so compose needs nothing).
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # nginx serves index.html on /, so a 200 there means it's up and serving.
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
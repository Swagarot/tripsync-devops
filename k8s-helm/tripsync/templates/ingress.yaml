# Two separate Ingress objects on purpose: annotations like rewrite-target
# apply to EVERY path in an Ingress. If "/" shared the /api rewrite, its
# empty $2 would rewrite every frontend request (JS, CSS, favicon) to "/",
# and nginx would serve index.html for all of them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripsync-api-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Photo uploads: ingress-nginx refuses bodies over 1 MB by default. The
    # backend's own limit is 15 MB (Flask MAX_CONTENT_LENGTH).
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # (?!metrics...) = "not followed by metrics": /api/metrics doesn't
          # match here, falls through to the frontend Ingress and gets the
          # app's index.html. So Prometheus's /metrics stays cluster-internal
          # (Prometheus scrapes the pod directly, not through the Ingress),
          # which matters now that the Cloudflare Tunnel makes this public.
          - path: /api(/|$)((?!metrics(/|$)).*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tripsync-backend
                port:
                  number: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripsync-ingress
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tripsync-frontend
                port:
                  number: {{ .Values.frontend.port }}

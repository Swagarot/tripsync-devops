{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tripsync-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: tripsync-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}

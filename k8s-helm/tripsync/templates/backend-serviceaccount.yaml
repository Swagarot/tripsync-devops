{{- if .Values.s3.enabled }}
# The backend's identity on EKS. terraform/aws/photos.tf links it to an IAM
# role allowed to read/write the photo bucket (EKS Pod Identity): the pod gets
# short-lived AWS credentials, no access key is stored anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.s3.serviceAccount }}
  namespace: {{ .Values.namespace }}
{{- end }}

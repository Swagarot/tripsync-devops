{{- /*
Secrets that used to be made by hand with kubectl, now copied from Vault by the
External Secrets Operator (terraform/vault). Same Secret names and keys, so
nothing that reads them changes.

creationPolicy Orphan: an existing hand-made Secret is taken over and updated
in place (no gap while switching), and removing the ExternalSecret leaves the
Secret behind instead of deleting it from under a running pod.

Rendered only where the operator is installed (its CRD exists), so turning it
on in values-k3s.yaml / values-eks.yaml is safe before Vault is set up, and a
cluster without it (the teacher's) just keeps its hand-made Secrets.
*/ -}}
{{- if and .Values.externalSecrets.enabled (.Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret") }}
{{- if .Values.externalSecrets.openrouteservice }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouteservice
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: openrouteservice
    creationPolicy: Orphan
  data:
    - secretKey: api-key
      remoteRef:
        key: tripsync/openrouteservice
        property: api-key
{{- end }}
{{- if .Values.externalSecrets.cloudflared }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.store }}
  target:
    name: cloudflared-token
    creationPolicy: Orphan
  data:
    - secretKey: token
      remoteRef:
        key: tripsync/cloudflared
        property: token
{{- end }}
{{- end }}

{{- /*
Secrets the backend and Postgres need, generated by Helm on the first install
so a fresh cluster (EKS) still deploys with no manual steps, and nothing
secret is ever in git or in the Jenkinsfiles.

`lookup` reads the Secret that already exists in the cluster. If it's there,
its values are copied back unchanged; only on the very first install are new
random values generated. Without this, every helm upgrade would invent a new
password: Postgres would keep the old one (it only reads POSTGRES_PASSWORD
when it initializes an empty data directory) and the backend could no longer
log in, and every user would be logged out (new JWT key).

`helm.sh/resource-policy: keep`: `helm uninstall` leaves this Secret in place,
for the same reason the Postgres volume survives an uninstall. Delete both by
hand only if you mean to start over with an empty database.

Note: `helm template` and `--dry-run` can't reach the cluster, so they show
new random values. Harmless, they're never applied.

Argo CD (the k3s deploys) renders the chart the same way, without the cluster,
so it would also see new random values on every sync. The tripsync Application
(argocd/apps.yaml) ignores this Secret's data and keeps the live values
(ignoreDifferences + RespectIgnoreDifferences): Argo CD creates the Secret once
and never changes its contents. The annotation below also keeps Argo CD from
ever pruning or deleting it.
*/ -}}
{{- $name := "tripsync-secrets" }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
{{- /*
Each key on its own: an existing Secret keeps its values, and keys added in a
later version (the Garage ones) are generated once and then kept the same way.
Garage wants hex: sha256sum of a random string gives 64 hex characters, and its
access key ids look like "GK" + 24 hex.
*/}}
{{- $old := ($existing).data | default dict }}
data:
  postgres-password: {{ $old | dig "postgres-password" (randAlphaNum 32 | b64enc) }}
  jwt-secret-key: {{ $old | dig "jwt-secret-key" (randAlphaNum 64 | b64enc) }}
  garage-rpc-secret: {{ $old | dig "garage-rpc-secret" (randAlphaNum 40 | sha256sum | b64enc) }}
  garage-admin-token: {{ $old | dig "garage-admin-token" (randAlphaNum 48 | b64enc) }}
  s3-access-key-id: {{ $old | dig "s3-access-key-id" (printf "GK%s" (randAlphaNum 40 | sha256sum | trunc 24) | b64enc) }}
  s3-secret-access-key: {{ $old | dig "s3-secret-access-key" (randAlphaNum 40 | sha256sum | b64enc) }}

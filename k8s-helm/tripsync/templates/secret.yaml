{{- /*
Secrets the backend and Postgres need, generated by Helm on the first install
so a fresh cluster (EKS) still deploys with no manual steps, and nothing
secret is ever in git or in the Jenkinsfiles.

`lookup` reads the Secret that already exists in the cluster. If it's there,
its values are copied back unchanged; only on the very first install are new
random values generated. Without this, every helm upgrade would invent a new
password: Postgres would keep the old one (it only reads POSTGRES_PASSWORD
when it initializes an empty data directory) and the backend could no longer
log in, and every user would be logged out (new JWT key).

`helm.sh/resource-policy: keep`: `helm uninstall` leaves this Secret in place,
for the same reason the Postgres volume survives an uninstall. Delete both by
hand only if you mean to start over with an empty database.

Note: `helm template` and `--dry-run` can't reach the cluster, so they show
new random values. Harmless, they're never applied.
*/ -}}
{{- $name := "tripsync-secrets" }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  postgres-password: {{ index $existing.data "postgres-password" }}
  jwt-secret-key: {{ index $existing.data "jwt-secret-key" }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc }}
  jwt-secret-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}

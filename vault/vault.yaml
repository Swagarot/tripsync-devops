# Helm values for HashiCorp Vault on the homelab (terraform/vault/main.tf).

# The agent injector (sidecars that write secrets into pods) is off: the
# External Secrets Operator does that job as plain Kubernetes Secrets, so the
# apps and the Helm chart don't need to know Vault exists.
injector:
  enabled: false

server:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

  # Raft data on Longhorn: two copies on two workers, like Postgres. Small:
  # Vault only holds a handful of secrets.
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: longhorn

  # Auto-unseal with AWS KMS (terraform/vault/kms.tf). Credentials and the key
  # id come from the Secret Terraform made; the seal reads these variables.
  extraSecretEnvironmentVars:
    - envName: AWS_ACCESS_KEY_ID
      secretName: vault-kms
      secretKey: access-key-id
    - envName: AWS_SECRET_ACCESS_KEY
      secretName: vault-kms
      secretKey: secret-access-key
    - envName: VAULT_AWSKMS_SEAL_KEY_ID
      secretName: vault-kms
      secretKey: kms-key-id
  extraEnvironmentVars:
    AWS_REGION: eu-central-1

  standalone:
    enabled: true
    # One server. Raft (integrated storage) instead of a plain file: same
    # single pod, but it supports `vault operator raft snapshot`, which the
    # nightly backup uses (terraform/vault-config/backup.tf).
    # TLS is off like the other private UIs (Argo CD, Grafana): traffic stays
    # inside the cluster or comes over Tailscale, which is encrypted
    # (WireGuard). Known weak spot: the NodePort is also on the home LAN in
    # plain http.
    config: |-
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = true
        }
      }

      storage "raft" {
        path = "/vault/data"
      }

      # Key id, region and credentials come from the environment (above).
      seal "awskms" {}

      service_registration "kubernetes" {}

      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }

# Private UI and API: a NodePort, reachable on the nodes' LAN and Tailscale
# addresses (like Argo CD on 30443 and Grafana on 30300). EKS reaches it over
# Tailscale too.
ui:
  enabled: true
  serviceType: NodePort
  serviceNodePort: 30820

serverTelemetry:
  serviceMonitor:
    enabled: true
  prometheusRules:
    enabled: true
    rules:
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Vault is sealed
          description: >-
            Vault restarted and could not auto-unseal: is AWS KMS reachable and
            is the vault-kms Secret's access key still valid? Apps keep their
            current Secrets, but nothing new syncs until Vault is unsealed.
      - alert: VaultMetricsMissing
        expr: absent(vault_core_unsealed)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: No metrics from Vault
          description: >-
            Prometheus gets nothing from Vault, so VaultSealed can't fire.
            Is the vault-0 pod running?

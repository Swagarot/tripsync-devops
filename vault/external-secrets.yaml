# Helm values for the External Secrets Operator (terraform/vault/main.tf on
# k3s, terraform/aws/vault.tf on EKS).
installCRDs: true

resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

certController:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

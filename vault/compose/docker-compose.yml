# HashiCorp Vault for TripSync, OUTSIDE the k3s cluster: a container on its
# own homelab machine (an LXC, not a k3s node), so a broken or compromised
# cluster doesn't take its secrets store with it. Both clusters reach it over
# Tailscale only.
#
#   cp .env.example .env    # fill it in (see the comments there)
#   docker compose up -d vault
#   docker compose exec vault vault operator init   # once; see ../README.md
#
# Network: Tailscale runs on the machine itself (not in Docker). Vault's port
# is published on 127.0.0.1 only, so nothing on the LAN can reach it, and
# `tailscale serve` forwards the tailnet's port 8200 to it (set up once, kept
# across reboots):
#   sudo tailscale serve --bg --tcp 8200 tcp://127.0.0.1:8200
# So Vault is reachable only at <machine>.<tailnet>.ts.net:8200 from tailnet
# devices the Tailscale ACL allows, and from nowhere else: not the LAN, not
# the internet. WireGuard encrypts it, hence no TLS in Vault itself.

services:
  vault:
    image: hashicorp/vault:2.0.4
    command: server
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      # Auto-unseal with AWS KMS (terraform/vault/kms.tf). After a restart or
      # reboot Vault unseals itself; nobody types unseal keys.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      VAULT_AWSKMS_SEAL_KEY_ID: ${VAULT_AWSKMS_SEAL_KEY_ID}
      AWS_REGION: eu-central-1
      VAULT_ADDR: http://127.0.0.1:8200   # for `docker compose exec vault vault ...`
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    restart: unless-stopped

  # Nightly Raft snapshot at 03:45 UTC (the container's clock), 14 days kept.
  # The whole Vault, still encrypted: restoring it needs the same KMS key.
  # This copy stays on the LXC's disk (undoes a deleted secret); the copy on
  # the NFS server is pulled nightly by a k3s CronJob
  # (terraform/vault-config/backup.tf), since an unprivileged LXC can't mount
  # NFS. Started once VAULT_BACKUP_TOKEN is in .env.
  backup:
    image: hashicorp/vault:2.0.4
    network_mode: service:vault   # reaches Vault at 127.0.0.1:8200
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (86400 + 3*3600 + 45*60 - $$(date +%s) % 86400) % 86400 ))
          vault token renew >/dev/null &&
          vault operator raft snapshot save /backups/vault-$$(date +%F).snap &&
          find /backups -name 'vault-*.snap' -mtime +14 -delete &&
          echo "$$(date) snapshot saved" || echo "$$(date) SNAPSHOT FAILED"
        done
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      # A periodic token with only the raft-snapshot policy; renewed on every
      # run, so it never expires while backups keep running (../README.md).
      VAULT_TOKEN: ${VAULT_BACKUP_TOKEN}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      - vault
    restart: unless-stopped

volumes:
  vault-data:

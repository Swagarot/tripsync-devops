# Local dev stack. Expects the app repos cloned next to this one:
#   tripsync repos/
#     tripsync-backend/
#     tripsync-frontend/
#     tripsync-devops/     <- run "docker compose up --build" here
# Open http://localhost:8080
#
# The passwords below are throwaway local-dev values for a database that only
# exists on the laptop. Real ones are generated by the Helm chart (secret.yaml).
services:
  postgres:
    image: postgres:18.6-alpine     # same version as the cluster (values.yaml)
    environment:
      POSTGRES_USER: tripsync
      POSTGRES_DB: tripsync
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - pgdata:/var/lib/postgresql  # Postgres 18 layout, like the chart
    # Same check as the chart's readiness probe. depends_on below waits for it.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tripsync", "-d", "tripsync"]
      interval: 2s
      retries: 30

  backend:
    build: ../tripsync-backend      # backend/Dockerfile in the sibling repo
    image: tripsync-backend:local   # local tag, never pushed
    environment: &backend-env
      POSTGRES_HOST: postgres
      POSTGRES_USER: tripsync
      POSTGRES_DB: tripsync
      POSTGRES_PASSWORD: local-dev-only
      JWT_SECRET_KEY: local-dev-only-not-a-real-secret-key
      # Optional: routes/travel times. Taken from your shell, never stored here:
      #   ORS_API_KEY=... docker compose up   (unset = straight lines only)
      ORS_API_KEY: ${ORS_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Plays the role of the Kubernetes init container: run the migrations once,
  # then exit. The backend starts only after it succeeded.
  migrate:
    build: ../tripsync-backend      # same image as backend (cached build)
    image: tripsync-backend:local
    command: ["flask", "db", "upgrade"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../tripsync-frontend
    image: tripsync-frontend:local

  # Plays the role of the Ingress: one entry point that splits /api from the
  # rest. Services reach each other by service name (backend, frontend) on
  # compose's default network, the same way Kubernetes Services work by name.
  gateway:
    image: nginx:alpine
    volumes:
      - ./compose/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"                   # host_port:container_port
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:                           # survives `docker compose down`; add -v to wipe it

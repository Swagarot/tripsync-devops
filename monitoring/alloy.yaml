# Grafana Alloy settings: the log collector (replaces Promtail, which is
# deprecated). Runs as a DaemonSet, one pod per node, each reading the
# container log files of its own node and pushing them to Loki.
# Installed by terraform/k3s/logging.tf (chart version pinned there).

controller:
  type: daemonset
  # Also run on the control node (it has the NoSchedule taint), so logs of
  # pods that live there (e.g. ingress-nginx's service load balancer) arrive.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  # The kubelet writes every container's stdout/stderr to /var/log/pods on the
  # node; mount it read-only into Alloy.
  mounts:
    varlog: true
  # Memory: 256Mi was too tight. Alloy's memory grows with every log file it
  # has followed (crash-looping pods make new ones all the time); near the
  # limit the kernel kept evicting its pages and reading them back: 549 GB
  # read from disk for 3 GB of logs, ~900 MB/s, which saturated the shared
  # Proxmox storage and took k3s (SQLite) and Longhorn down with it
  # (2026-11-06, the second time; a restart only reset the growth).
  # GOMEMLIMIT makes Go's garbage collector work harder before the limit
  # instead of letting the kernel thrash; set below the limit to leave room
  # for non-heap memory.
  resources:
    requests: { cpu: 20m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnv:
    - name: GOMEMLIMIT
      value: 400MiB
  configMap:
    content: |
      // 1. Find the pods running on THIS node. HOSTNAME is set to the node
      //    name by the chart (fieldRef spec.nodeName).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // 2. Turn Kubernetes metadata into Loki labels (what you filter on in
      //    Grafana) and build the path of each container's log files.
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          separator     = ""
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      // 3. Expand the glob into the actual files and tail them.
      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // 4. The files are in the container runtime (CRI) format:
      //    "<time> <stream> <flag> <message>". Strip that wrapper so Loki
      //    stores the real log line with the right timestamp.
      loki.process "pods" {
        stage.cri {}
        forward_to = [loki.write.default.receiver]
      }

      // 5. Push to Loki (Service "loki" in the monitoring namespace).
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

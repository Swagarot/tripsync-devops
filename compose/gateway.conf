# Local stand-in for the two Kubernetes Ingress objects, so the browser talks
# to one origin (no CORS) exactly like in k3s:
#   /api/...  -> backend, with the /api prefix stripped (like rewrite-target /$2)
#   /...      -> frontend nginx
server {
    listen 80;

    # The trailing slash on proxy_pass replaces the matched "/api/" with "/",
    # so /api/health reaches Flask as /health.
    location /api/ {
        proxy_pass http://backend:5000/;
        # Pass the browser's IP on, like ingress-nginx does. The backend's
        # ProxyFix reads it, so the login rate limit is per client, not per
        # gateway.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Photo uploads (same as the chart's ingress annotation).
        client_max_body_size 16m;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
